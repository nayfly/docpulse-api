<svg
  width="100%"
  viewBox="0 0 680 520"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">DocPulse architecture diagram</title>
  <desc id="desc">
    Interactive architecture diagram for DocPulse. Each node links to the
    relevant source file or documentation section.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto-start-reverse"
    >
      <path
        d="M2 1L8 5L2 9"
        fill="none"
        stroke="#bdb9b0"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>

    <style>
      .edge {
        fill: none;
        stroke: #bdb9b0;
        stroke-width: 1.5;
        marker-end: url(#arrow);
      }

      .edge-dashed {
        fill: none;
        stroke: #c6c1b5;
        stroke-width: 1.25;
        stroke-dasharray: 5 4;
        marker-end: url(#arrow);
      }

      .label {
        fill: #d1cec2;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 12px;
      }

      .node-label {
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-anchor: middle;
      }

      .node-subtitle {
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 12px;
        text-anchor: middle;
      }

      .node-link {
        cursor: pointer;
      }

      .node-shape {
        stroke-width: 1;
        transition: transform 160ms ease, stroke-width 160ms ease,
          filter 160ms ease;
      }

      .node-link:hover .node-shape,
      .node-link:focus .node-shape {
        filter: brightness(1.08);
        stroke-width: 1.6;
      }

      .node-link:hover .node-text,
      .node-link:focus .node-text {
        text-decoration: underline;
      }
    </style>
  </defs>

  <a
    class="node-link"
    href="https://github.com/nayfly/docpulse-api/blob/main/README.md#api-reference"
    target="_top"
  >
    <g>
      <rect
        class="node-shape"
        x="20"
        y="220"
        width="100"
        height="44"
        rx="8"
        fill="#444441"
        stroke="#b4b2a9"
      />
      <text
        class="node-label node-text"
        x="70"
        y="247"
        fill="#d3d1c7"
      >
        Client
      </text>
    </g>
  </a>

  <line class="edge" x1="120" y1="242" x2="168" y2="242" />
  <text class="label" x="144" y="235" text-anchor="middle">HTTP</text>

  <a
    class="node-link"
    href="https://github.com/nayfly/docpulse-api/blob/main/apps/documents/views.py"
    target="_top"
  >
    <g>
      <rect
        class="node-shape"
        x="170"
        y="210"
        width="130"
        height="64"
        rx="8"
        fill="#3c3489"
        stroke="#afa9ec"
      />
      <text
        class="node-label node-text"
        x="235"
        y="236"
        fill="#cecaf6"
      >
        Django API
      </text>
      <text
        class="node-subtitle node-text"
        x="235"
        y="256"
        fill="#afa9ec"
      >
        DRF + JWT auth
      </text>
    </g>
  </a>

  <line class="edge" x1="235" y1="274" x2="235" y2="330" />

  <a
    class="node-link"
    href="https://github.com/nayfly/docpulse-api/blob/main/apps/documents/models.py"
    target="_top"
  >
    <g>
      <rect
        class="node-shape"
        x="170"
        y="332"
        width="130"
        height="56"
        rx="8"
        fill="#0c447c"
        stroke="#85b7eb"
      />
      <text
        class="node-label node-text"
        x="235"
        y="356"
        fill="#b5d4f4"
      >
        PostgreSQL
      </text>
      <text
        class="node-subtitle node-text"
        x="235"
        y="374"
        fill="#85b7eb"
      >
        Documents + users
      </text>
    </g>
  </a>

  <line class="edge" x1="235" y1="210" x2="235" y2="160" />

  <a
    class="node-link"
    href="https://github.com/nayfly/docpulse-api/blob/main/apps/documents/services.py"
    target="_top"
  >
    <g>
      <rect
        class="node-shape"
        x="170"
        y="100"
        width="130"
        height="56"
        rx="8"
        fill="#085041"
        stroke="#5dcaa5"
      />
      <text
        class="node-label node-text"
        x="235"
        y="124"
        fill="#9fe1cb"
      >
        MinIO
      </text>
      <text
        class="node-subtitle node-text"
        x="235"
        y="142"
        fill="#5dcaa5"
      >
        S3-compatible storage
      </text>
    </g>
  </a>

  <line class="edge" x1="300" y1="242" x2="358" y2="242" />
  <text class="label" x="329" y="235" text-anchor="middle">enqueue</text>

  <a
    class="node-link"
    href="https://github.com/nayfly/docpulse-api/blob/main/config/settings.py"
    target="_top"
  >
    <g>
      <rect
        class="node-shape"
        x="360"
        y="210"
        width="120"
        height="64"
        rx="8"
        fill="#633806"
        stroke="#ef9f27"
      />
      <text
        class="node-label node-text"
        x="420"
        y="236"
        fill="#fac775"
      >
        Redis
      </text>
      <text
        class="node-subtitle node-text"
        x="420"
        y="256"
        fill="#ef9f27"
      >
        Broker + Q&amp;A cache
      </text>
    </g>
  </a>

  <line class="edge" x1="480" y1="242" x2="538" y2="242" />
  <text class="label" x="509" y="235" text-anchor="middle">consume</text>

  <a
    class="node-link"
    href="https://github.com/nayfly/docpulse-api/blob/main/apps/documents/tasks.py"
    target="_top"
  >
    <g>
      <rect
        class="node-shape"
        x="540"
        y="210"
        width="120"
        height="64"
        rx="8"
        fill="#712b13"
        stroke="#f0997b"
      />
      <text
        class="node-label node-text"
        x="600"
        y="236"
        fill="#f5c4b3"
      >
        Celery worker
      </text>
      <text
        class="node-subtitle node-text"
        x="600"
        y="256"
        fill="#f0997b"
      >
        Async processing
      </text>
    </g>
  </a>

  <path class="edge-dashed" d="M600 210 L600 128 L302 128" />
  <text class="label" x="500" y="118" text-anchor="middle">download file</text>

  <line class="edge" x1="600" y1="274" x2="600" y2="330" />

  <a
    class="node-link"
    href="https://github.com/nayfly/docpulse-api/blob/main/apps/documents/services.py"
    target="_top"
  >
    <g>
      <rect
        class="node-shape"
        x="540"
        y="332"
        width="120"
        height="56"
        rx="8"
        fill="#27500a"
        stroke="#97c459"
      />
      <text
        class="node-label node-text"
        x="600"
        y="356"
        fill="#c0dd97"
      >
        Ollama
      </text>
      <text
        class="node-subtitle node-text"
        x="600"
        y="374"
        fill="#97c459"
      >
        llama3.1:8b local
      </text>
    </g>
  </a>

  <path class="edge-dashed" d="M540 270 L420 400 L302 388" />
  <text class="label" x="400" y="418" text-anchor="middle">save results</text>

  <path class="edge-dashed" d="M540 252 L420 460 L70 460 L70 266" />
  <text class="label" x="240" y="478" text-anchor="middle">webhook (HMAC signed)</text>

  <a
    class="node-link"
    href="https://github.com/nayfly/docpulse-api/blob/main/docker-compose.yml"
    target="_top"
  >
    <g>
      <rect
        class="node-shape"
        x="540"
        y="430"
        width="120"
        height="44"
        rx="8"
        fill="#444441"
        stroke="#b4b2a9"
      />
      <text
        class="node-label node-text"
        x="600"
        y="457"
        fill="#d3d1c7"
      >
        Flower
      </text>
    </g>
  </a>

  <line class="edge" x1="600" y1="390" x2="600" y2="428" />
  <text class="label" x="638" y="415">monitor</text>

  <line class="edge-dashed" x1="20" y1="496" x2="46" y2="496" />
  <text class="label" x="52" y="500">async / internal</text>

  <line class="edge" x1="170" y1="496" x2="196" y2="496" />
  <text class="label" x="202" y="500">sync request</text>
</svg>
